[tool.coverage.run]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 1

# npm-style scripts: `poe test`, `poe cov`, etc. (requires `poethepoet` from requirements.txt)
[tool.poe.tasks]
test = "pytest tests/ -v"
test-quiet = "pytest tests/ -q"
cov = "pytest tests/ --cov=reader --cov=classifier --cov=rules --cov=actions --cov=config --cov=main --cov-report=term-missing --cov-fail-under=80"
cov-html = "pytest tests/ --cov=reader --cov=classifier --cov=rules --cov=actions --cov=config --cov=main --cov-report=term-missing --cov-report=html --cov-fail-under=80"
dry-run = "python main.py --dry-run"
# ~7 days, 500 msgs — same as: poe dry-run --lookback 10080 --limit 500
dry-run-wide = "python main.py --dry-run --lookback 10080 --limit 500"
dry-run-spam = "python main.py --dry-run --policy spam"
# Recent messages: tags + matched rules + planned actions + SQLite subset (read-only DB; Claude unless --no-classify)
preview-recent = "python scripts/dry_run_recent.py"
preview-recent-offline = "python scripts/dry_run_recent.py --no-classify"
preview-recent-compact = "python scripts/dry_run_recent.py --compact"
preview-recent-compact-offline = "python scripts/dry_run_recent.py --compact --no-classify"
preview-recent-spam = "python scripts/dry_run_recent.py --policy spam"
preview-recent-spam-offline = "python scripts/dry_run_recent.py --policy spam --no-classify"
# Extra args append to the command — do not use a bare `--` (it is passed to main.py and breaks argparse).
run-political = "python main.py"
# Phase 2: after spam-policy UI actions, optionally set is_read (Dock badge); political runs are archive-only.
run-political-mark-read = "python main.py --mark-read-phase2"
# Mark older inbound unread read in chat.db (keep K newest). Extra flags: see scripts/bulk_mark_read.py --help
bulk-mark-read = "python scripts/bulk_mark_read.py --keep-unread 10"
# Read-only unread breakdown vs Dock. Nuclear clear: poe bulk-mark-read --keep-unread 0 --every-inbound
badge-diagnose = "python scripts/bulk_mark_read.py --diagnose"
# Sync read flags in chat.db, then restart Dock + Notification Center (stuck badge vs diagnose).
fix-badge = { sequence = ["bulk-mark-read-clear", "fix-messages-badge-shell"] }
bulk-mark-read-clear = "python scripts/bulk_mark_read.py --keep-unread 0 --fix-joined-outbound-read"
fix-messages-badge-shell = "bash scripts/fix_messages_badge_stuck.sh"
# Backup chat.db, then live-step unread down (Messages open; ~0.12s per row).
doit = { sequence = ["backup-db", "mark-read-live"] }
mark-read-live = "python scripts/bulk_mark_read.py --keep-unread 10 --live --delay 0.12"
run-spam = "python main.py --policy spam"
# Full pass helpers (same effect as chaining the listed poe tasks; uses python main.py for args).
run-political-quiet-wide = "python main.py --quiet --lookback 10080 --limit 500"
run-spam-quiet-wide = "python main.py --policy spam --quiet --lookback 10080 --limit 500"
political-all = { sequence = ["backup-db", "quit-messages", "run-political-quiet-wide"] }
# After political-all: clear local unread + refresh Dock, then show diagnose (no re-classify).
political-done = { sequence = ["fix-badge", "badge-diagnose"] }
spam-all = { sequence = ["backup-db", "quit-messages", "run-spam-quiet-wide"] }
# Copy CHAT_DB_PATH (from .env) to backups/chat.db.UTC-<YYYY-MM-DDTHH-MM-SSZ>.bak
backup-db = "python scripts/backup_chat_db.py"
# Quit Messages (iMessage) if running — run before backup-db / archive (macOS)
quit-messages = "bash scripts/quit_messages.sh"
# Experimental: double-click top N sidebar rows (Accessibility) — ghost unread / "No Conversation Selected"
messages-scrub-ui = "python scripts/messages_scrub_sidebar.py"
# Print a copy-pasteable `cd …` to repo root (backups/, logs, blocklist, .env)
echo-cd-root = "python scripts/echo_repo_cd.py"
# Background agent (launchd): install once; see README "Background daemon".
daemon-install = "bash scripts/install_sms_ripper_launchagent.sh install"
daemon-install-15m = "bash scripts/install_sms_ripper_launchagent.sh install 900"
daemon-uninstall = "bash scripts/install_sms_ripper_launchagent.sh uninstall"
daemon-status = "bash scripts/install_sms_ripper_launchagent.sh status"
daemon-log = "tail -n 200 logs/daemon.log"
daemon-cycle-once = "python scripts/daemon_cycle.py"
daemon-fda-path = "python scripts/print_fda_python.py"
fda-assist = "python scripts/fda_assist.py"
# Probe chat.db reads (Python, /bin/cp, sqlite3) — ground truth for Full Disk Access; not a TCC DB reader.
verify-fda = "python scripts/verify_fda.py"
# Static HTML report of POLITICAL_archive (daemon runs this at end of each cycle)
report-generate = "python scripts/generate_report_html.py"
report-open = "open reports/index.html"
daemon-cycles-generate = "python scripts/generate_daemon_cycles_html.py --max-cycles 50"
daemon-cycles-open = "open reports/daemon-cycles/index.html"
# Alias: opens the same cycle index as daemon-cycles-open
daemon-cycle-index = "open reports/daemon-cycles/index.html"
# chat.db read-only reports (macOS + Full Disk Access; see docs/QUERIES.md)
query-total = "bash scripts/run_chat_query.sh queries/total_messages.sql"
query-text = "bash scripts/run_chat_query.sh queries/text_messages_no_tapback.sql"
query-directions = "bash scripts/run_chat_query.sh queries/direction_counts.sql"
query-chats = "bash scripts/run_chat_query.sh queries/chat_count.sql"
query-top-chats = "bash scripts/run_chat_query.sh queries/top_chats.sql"
query-recent = "bash scripts/run_chat_query.sh queries/recent_20.sql"
query-recent-tags = "python scripts/format_recent_simple.py"
query-recent-tags-offline = "python scripts/format_recent_simple.py --no-classify"
query-handles = "bash scripts/run_chat_query.sh queries/handles_sample.sql"
query-empty-text = "bash scripts/run_chat_query.sh queries/empty_text_count.sql"
query-associated-types = "bash scripts/run_chat_query.sh queries/associated_type_breakdown.sql"
query-orphans = "bash scripts/run_chat_query.sh queries/orphan_messages.sql"
